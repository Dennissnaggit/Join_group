<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>

    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./style/font.css" />
    <link rel="stylesheet" href="./style/log-in.css">
    <link rel="icon" type="image/png" href="./assets/logo/fav_icon.png">
  </head>
  <body>
    <section class="start-logo">
      <img src="./assets/icons/Capa 2.png" alt="Logo" class="logo" />
      <img src="./assets/icons/join-logo-responsiv.png" alt="Logo" class="logo-responsive" />
      <section class="nav-bar">
        <p>Not a Join user ?</p>
        <a class="button-dark sign-up-link" href="./pages/sign-up.html">Sign up</a>
      </section>
      <section class="log-in">
    <form class="login-box login-box--login" id="loginForm" novalidate>
        <h2 class="auth-title text-center">Log in</h2>
        <hr class="custom-hr" />

          <div class="auth-input-group position-relative mb-3">
            <input
              type="email"
              class="form-control pe-5"
              id="loginEmail"
              placeholder="Email"
              aria-label="Email"
            />

            <img
              src="./assets/icons/images/mail.png"
              alt="Email"
              class="custom-icon"
            />
          </div>

          <div class="auth-input-group position-relative login-password-field">
            <input
              type="password"
              class="form-control password-input"
              id="loginPassword"
              placeholder="Password"
              aria-label="Password"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-toggle"
              id="toggleLoginPassword"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img
                src="./assets/icons/images/lock.png"
                alt=""
                class="password-toggle__lock"
              />
              <svg
                class="password-toggle__eye"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.5" />
                <path class="password-toggle__slash" d="M4 4l16 16" />
              </svg>
            </button>
          </div>
          <p
            class="login-field-error"
            id="loginCredentialsError"
            role="alert"
            aria-live="polite"
          ></p>
          <div class="btn-group">
            <button type="submit" class="button-dark">Log In</button>
            <a class="guest-login" href="./pages/summary.html" onclick="localStorage.removeItem('userName'); localStorage.setItem('currentUser', JSON.stringify({email: 'guest@join.com', name: 'Guest User', isGuest: true}))">
                <button type="button" class="button-outline">Guest Log in</button>
            </a>
          </div>
        </form>
      <!-- Neue Message -->
  <div
    id="signupMessage"
    class="success-message"
    role="alert"
    aria-live="polite"
  ></div>
</section>
      <div class="legals">
    <a href="./pages/privacy_policy.html?view=external">Privacy Policy</a>
     <a href="./pages/legal_notice.html?view=external">Legal Notice</a>
     </div>
    </section>
    <script type="module" src="./script/signIn.js"></script>
  </body>
</html>
