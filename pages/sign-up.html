<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../script.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../style/font.css" />
    <link rel="stylesheet" href="../style/log-in.css" />
    <link rel="icon" type="image/png" href="../assets/logo/fav_icon.png">
  </head>
  <body class="sign-up-page">
    <section class="start-logo">
      <a href="../index.html">
        <img src="../assets/icons/Capa 2.png" alt="Logo" class="logo" />
      </a>
      <section class="log-in">
        <form class="login-box login-box--signup" id="signupForm" novalidate>
          <div class="sign-up-head">
            <a href="../index.html"
              ><img src="../assets/icons/images/arrow-left-line.png" alt=""
            /></a>

            <h2 class="auth-title">Sign Up</h2>
          </div>
          <hr class="custom-hr" />

          <div class="auth-input-group position-relative mb-3">
            <input
              type="text"
              class="form-control pe-5"
              id="signupName"
              placeholder="Name"
              aria-label="Name"
              autocomplete="name"
              required
            />

            <img
              src="../assets/icons/images/person.png"
              alt="Name"
              class="custom-icon"
            />
            <p
              class="signup-field-error"
              id="signupNameError"
              aria-live="polite"
            ></p>
          </div>

          <div class="auth-input-group position-relative mb-3">
            <input
              type="email"
              class="form-control pe-5"
              id="signupEmail"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              required
            />

            <img
              src="../assets/icons/images/mail.png"
              alt="Email"
              class="custom-icon"
            />
            <p
              class="signup-field-error"
              id="signupEmailError"
              aria-live="polite"
            ></p>
          </div>

          <div class="auth-input-group position-relative mb-3">
            <input
              type="password"
              class="form-control password-input"
              id="signupPassword"
              placeholder="Password"
              aria-label="Password"
              autocomplete="new-password"
              minlength="6"
              required
            />

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img
                src="../assets/icons/images/lock.png"
                alt=""
                class="password-toggle__lock"
              />
              <svg
                class="password-toggle__eye"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.5" />
                <path class="password-toggle__slash" d="M4 4l16 16" />
              </svg>
            </button>
            <p
              class="signup-field-error"
              id="signupPasswordError"
              aria-live="polite"
            ></p>
          </div>

          <div class="auth-input-group position-relative mb-3">
            <input
              type="password"
              class="form-control password-input"
              id="signupConfirmPassword"
              placeholder="Confirm Password"
              aria-label="Confirm Password"
              autocomplete="new-password"
              minlength="6"
              required
            />

            <button
              type="button"
              class="password-toggle"
              id="togglePasswordUp"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img
                src="../assets/icons/images/lock.png"
                alt=""
                class="password-toggle__lock"
              />
              <svg
                class="password-toggle__eye"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.5" />
                <path class="password-toggle__slash" d="M4 4l16 16" />
              </svg>
            </button>
            <p
              class="signup-field-error"
              id="signupConfirmPasswordError"
              aria-live="polite"
            ></p>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="checkDefault"
              required
            />
            <label class="form-check-label" for="checkDefault">
              accept the <a href="./privacy_policy.html?view=external">Privacy Policy</a>
            </label>
            <p
              class="signup-field-error"
              id="checkDefaultError"
              aria-live="polite"
            ></p>
          </div>
          <div class="btn-group">
            <button type="submit" class="button-dark">Sign Up</button>
          </div>
        </form>
      </section>
      <div class="legals">
        <a href="./privacy_policy.html?view=external">Privacy Policy</a>
        <a href="./legal_notice.html?view=external">Legal Notice</a>
      </div>
    </section>
    <div
      id="signupMessage"
      class="success-message"
      role="alert"
      aria-live="polite"
    ></div>
    <script type="module" src="../script/firebase.js"></script>
    <script type="module" src="../script/signUp.js"></script>
  </body>
</html>
