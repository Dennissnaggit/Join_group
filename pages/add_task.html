<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Add Task</title>
    <link rel="icon" type="image/png" href="../assets/logo/fav_icon.png" />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../style/font.css" />
    <link rel="stylesheet" href="../style/app_layout.css" />
    <link rel="stylesheet" href="../style/components.css" />
    <link rel="stylesheet" href="../style/add_task.css" />
    <script type="module" src="../script/add_task.js"></script>
    <script src="../script.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <div w3-include-html="../components/sidebar.html"></div>

      <div class="main-content-wrapper">
        <!-- Header -->
        <div w3-include-html="../components/header.html"></div>

        <!-- Main Content Area -->
        <main class="content-panel" id="content">
          <form
            class="add-task-container app-page-layout"
            id="addTaskForm"
            novalidate
          >
            <header class="headerTask">
              <h1>Add Task</h1>
            </header>

            <div class="inputsTask">
              <!-- Left Column -->
              <div class="inputLeft">
                <div class="form-group">
                  <label for="TitleOfTask" class="form-label"
                    >Title<span class="required-star">*</span></label
                  >

                  <input
                    type="text"
                    class="form-control"
                    id="TitleOfTask"
                    placeholder="Enter a Title"
                    required
                  />
                  <p
                    class="add-task-field-error"
                    id="TitleOfTaskError"
                    aria-live="polite"
                  ></p>
                </div>

                <div class="form-group">
                  <label for="exampleFormControlTextarea1" class="form-label"
                    >Description</label
                  >
                  <textarea
                    class="form-control"
                    id="exampleFormControlTextarea1"
                    rows="3"
                    placeholder="Enter a Description"
                  ></textarea>
                </div>

                <div class="form-group">
                  <label for="exampleFormControlInput1" class="form-label">
                    Due date<span class="required-star">*</span>
                  </label>

                  <div class="due-date-input-wrapper">
                    <input
                      type="date"
                      class="form-control due-date-input"
                      id="exampleFormControlInput1"
                      lang="en-GB"
                      required
                    />
                    <span class="due-date-placeholder" aria-hidden="true"
                      >dd/mm/yyyy</span
                    >
                  </div>
                  <p
                    class="add-task-field-error"
                    id="exampleFormControlInput1Error"
                    aria-live="polite"
                  ></p>
                </div>
              </div>

              <!-- Right Column -->
              <div class="inputRight">
                <div class="prioritySection">
                  <span class="form-label-style">Priority</span>
                  <div class="priorityButtons">
                    <input
                      type="radio"
                      class="btn-check"
                      name="priority"
                      id="urgent"
                      autocomplete="off"
                    />
                    <label class="priorityBtn urgentBtn" for="urgent">
                      <span>Urgent</span>
                      <img
                        src="../assets/AdTask/prioUrgentNotActive.png"
                        alt=""
                      />
                    </label>

                    <input
                      type="radio"
                      class="btn-check"
                      name="priority"
                      id="medium"
                      autocomplete="off"
                      checked
                    />
                    <label class="priorityBtn mediumBtn" for="medium">
                      <span>Medium</span>
                      <img src="../assets/AdTask/prioMedActive.png" alt="" />
                    </label>

                    <input
                      type="radio"
                      class="btn-check"
                      name="priority"
                      id="low"
                      autocomplete="off"
                    />
                    <label class="priorityBtn lowBtn" for="low">
                      <span>Low</span>
                      <img src="../assets/AdTask/prioLowNotActive.png" alt="" />
                    </label>
                  </div>
                </div>

                <div class="form-group">
    <label class="form-label">Assigned to</label>

    <div class="bat-dropdown-wrapper" id="assignedToWrapper">

        <div class="form-control bat-dropdown-toggle" id="assignedToToggle">
            <span>Select contacts to assign</span>
            <span class="bat-dropdown-arrow">⌄</span>
        </div>

        <div
            id="assignedToDropdown"
            class="bat-dropdown d-none"
        >
            <div class="bat-dropdown-search-wrapper">
                <input
                    id="assignedToSearch"
                    class="bat-dropdown-search"
                    type="text"
                    placeholder="Search contacts"
                />
            </div>

            <div id="assignedToOptions"></div>
        </div>

        <div
            id="assignedToSelected"
            class="bat-selected-avatars"
        ></div>

    </div>
</div>

                <div class="form-group">
                  <label for="categoryToggle" class="form-label"
                    >Category<span class="required-star">*</span></label
                  >
                  <div class="category-dropdown-wrapper" id="categoryDropdownWrapper">
                    <input type="hidden" id="category" name="category" />
                    <button
                      type="button"
                      class="category-toggle"
                      id="categoryToggle"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="categoryOptions"
                    >
                      <span id="categorySelectedText">Select task category</span>
                      <span class="category-arrow" aria-hidden="true">⌄</span>
                    </button>
                    <div
                      class="category-options d-none"
                      id="categoryOptions"
                      role="listbox"
                    >
                      <button type="button" role="option" data-value="kategorie1">User Story</button>
                      <button type="button" role="option" data-value="kategorie2">Technical Task</button>
                    </div>
                  </div>
                  <p
                    class="add-task-field-error"
                    id="categoryError"
                    aria-live="polite"
                  ></p>
                </div>

                <div class="form-group">
                  <label for="subtaskInput" class="form-label">Subtasks</label>

                  <div class="position-relative">
                    <input
                      type="text"
                      id="subtaskInput"
                      class="form-control pe-5"
                      placeholder="add new subtask"
                    />

                    <div
                      id="inputActions"
                      class="position-absolute top-50 end-0 translate-middle-y me-2 d-none align-items-center"
                    >
                      <img
                        src="../assets/subtask/delete.png"
                        class="action-icon"
                        onclick="clearSubtaskInput()"
                        alt="Abbrechen"
                      />

                      <div class="action-divider"></div>

                      <img
                        src="../assets/subtask/check.png"
                        class="action-icon"
                        onclick="addSubtask()"
                        alt="Hinzufügen"
                      />
                    </div>
                  </div>

                  <ul id="subtaskList" class="list-group mt-2"></ul>
                </div>
              </div>
            </div>

            <!-- Footer Area inside the form container -->
            <footer class="footerTask">
              <span class="required-notice"
                ><span class="required-star">*</span>This field is
                required</span
              >

              <div class="footerButtons">
                <button type="button" class="clearBtn">✕ Clear</button>
                <button type="submit" class="createBtn">✓ Create Task</button>
              </div>
            </footer>
          </form>
        </main>
      </div>
    </div>

    <div
      class="task-added-message"
      id="taskAddedMessage"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      <span>Task added to board</span>
      <img src="../assets/icons/board.svg" alt="" />
    </div>
  </body>
</html>
